services:

  # =========================
  # User Service Database
  # =========================
  user-db:
    image: postgres:16
    container_name: user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - internship-network

  # =========================
  # User Service
  # =========================
  user-service:
    image: maven:3.9-eclipse-temurin-21
    container_name: user-service
    working_dir: /app
    command: mvn clean quarkus:dev
    depends_on:
      - user-db
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://user-db:5432/user_db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
    volumes:
      - ./user-service:/app
      - maven_cache:/root/.m2
    ports:
      - "8081:8080"
    networks:
      - internship-network

  # =========================
  # Internship Service Database
  # =========================
  internship-db:
    image: postgres:16
    container_name: internship-db
    environment:
      POSTGRES_DB: internship_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - internship_db_data:/var/lib/postgresql/data
    networks:
      - internship-network

  # =========================
  # Internship Service
  # =========================
  internship-service:
    image: maven:3.9-eclipse-temurin-21
    container_name: internship-service
    working_dir: /app
    command: mvn clean quarkus:dev
    depends_on:
      - internship-db
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://internship-db:5432/internship_db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
    volumes:
      - ./internship-service:/app
      - maven_cache:/root/.m2
    ports:
      - "8082:8080"
    networks:
      - internship-network

  # =========================
  # Evaluation Service Database
  # =========================
  evaluation-db:
    image: postgres:16
    container_name: evaluation-db
    environment:
      POSTGRES_DB: evaluation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - evaluation_db_data:/var/lib/postgresql/data
    networks:
      - internship-network

  # =========================
  # Evaluation Service
  # =========================
  evaluation-service:
    image: maven:3.9-eclipse-temurin-21
    container_name: evaluation-service
    working_dir: /app
    command: mvn clean quarkus:dev
    depends_on:
      - evaluation-db
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://evaluation-db:5432/evaluation_db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
    volumes:
      - ./evaluation-service:/app
      - maven_cache:/root/.m2
    ports:
      - "8083:8080"
    networks:
      - internship-network

  # =========================
  # Keycloak
  # =========================
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - internship-network

# =========================
# Persistent Volumes
# =========================
volumes:
  user_db_data:
  internship_db_data:
  evaluation_db_data:
  keycloak_data:
  maven_cache:

# =========================
# Network
# =========================
networks:
  internship-network:
    driver: bridge